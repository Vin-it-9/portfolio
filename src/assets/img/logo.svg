      <stop offset="42%" stop-color="#EEF2FF" />
      <stop offset="72%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#E9EDFF" />
  </linearGradient>

    <!-- Very subtle highlight -->
    <linearGradient
            id="dukeBlobHighlight"
            x1="0"
            y1="-300"
            x2="0"
            y2="300"
            gradientUnits="userSpaceOnUse"
    >
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
  </linearGradient>

    <!-- Soft depth -->
    <filter
            id="dukeBlobShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
    >
